# gitleaks configuration, used by the shared security workflow
# (OpenVibers/OpenVibe.Shared/.github/workflows/security.yml). The default rules stay on; every
# allowlist below is one proven false positive, matched on path AND value so nothing else is hidden.
[extend]
useDefault = true

[[allowlists]]
description = "Placeholder tokens (YOUR_JWT, hbt_YOUR_TOKEN_HERE, hbt_a1b2c3d4e5f6...) in the API token docs"
condition = "AND"
paths = ['''^docs/api-tokens\.md$''']
regexes = ['''^(YOUR_JWT|hbt_YOUR_TOKEN_HERE|hbt_a1b2c3d4e5f6\.\.\.)$''']

[[allowlists]]
description = "Stream key committed in the initial release's hardware-bridge example (ac0d6a47). Rotated on 2026-09-23 (it matched no key afterwards); the file now carries a placeholder."
condition = "AND"
paths = ['''^control-bridge-example-cozmo\.py$''']
commits = ["ac0d6a47f8d4e7f86bb2a9323bd7d3047da9c821"]
