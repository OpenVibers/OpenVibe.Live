name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # install, node --check, npm test (with the home page size budgets) and openvibe-contracts-check:
  # the shared test job (Track Q).
  test:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@e8b0caf086ad1f8fceaac80e2dca6cfe64f63602
    with:
      syntax-dirs: server scripts public/js
      contracts-service: live
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo (Track Q).
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@83c998b65424fb97e6f6de55ad9cc5981767e89c
