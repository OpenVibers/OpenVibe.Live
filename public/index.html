    <!-- Critical theme bootstrap (ov-theme-boot) — MUST stay inline and stay ABOVE the stylesheets.
         Paints the user's cached theme synchronously, before the browser has any chance to
         render the default palette. theme-loader.js used to be the first thing to touch the
         theme, but it is fetched over the network and loaded with defer, so it ran after the
         page had already painted — that gap is the purple flash. This reads localStorage
         only: no network, no parse blocking, works offline and on the very first paint. -->
    <script>
    (function () {
        try {
            var raw = localStorage.getItem('ov_theme');
            if (!raw) return;
            var t = JSON.parse(raw), v = t && t.variables;
            if (!v) return;
            var el = document.documentElement;
            for (var k in v) if (k.charAt(0) === '-') el.style.setProperty(k, v[k]);
            if (t.id) el.setAttribute('data-theme', t.id);
        } catch (_) { /* cold cache or private mode — theme-loader.js resolves it shortly */ }
    })();
    // "Lite" rendering for phones, coarse pointers and low-memory devices. Stylesheets on every
    // route key off .rs-lite, so it is decided here, before first paint, rather than by the home
    // page's effects script (which only loads on the home route).
    (function () {
        try {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            if (matchMedia('(pointer: coarse)').matches || matchMedia('(max-width: 820px)').matches || (navigator.deviceMemory && navigator.deviceMemory <= 4)) {
                document.documentElement.classList.add('rs-lite');
            }
        } catch (_) { /* */ }
    })();
    </script>

    <!-- Placeholder styling, inline on purpose.
         The skeletons below are in the HTML so the page reserves the space each feed will occupy
         before a single script runs. That only works if their styling is here too — a stylesheet
         request would land after the first paint, which is the moment it is needed. ~1KB. -->
    <style id="ovsk-css">
    .ovsk{position:relative;overflow:hidden;background:var(--bg-card,#171826);border:1px solid var(--border,rgba(255,255,255,.08));border-radius:14px}
    .ovsk-bar{position:relative;overflow:hidden;background:color-mix(in srgb,var(--text-muted,#8b93ad) 14%,transparent);border-radius:6px}
    .ovsk::after,.ovsk-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--text-primary,#f1f4fb) 7%,transparent) 50%,transparent 80%);transform:translateX(-100%);animation:ovskSweep 1.5s ease-in-out infinite}
    @keyframes ovskSweep{to{transform:translateX(100%)}}
    .ovsk-card{display:flex;flex-direction:column}
    .ovsk-thumb{aspect-ratio:16/9;width:100%;background:color-mix(in srgb,var(--text-muted,#8b93ad) 10%,transparent)}
    .ovsk-meta{display:flex;gap:10px;align-items:center;padding:10px 12px 12px}
    .ovsk-av{width:32px;height:32px;border-radius:50%;flex:none}
    .ovsk-lines{flex:1;min-width:0;display:grid;gap:6px}
    .ovsk-panel{padding:14px;display:grid;gap:10px}
    .ovsk-fade{animation:ovskFade .25s ease forwards}
    @keyframes ovskFade{to{opacity:0}}
    @media (max-width:760px){#stream-grid-live .ovsk-card:nth-of-type(n+3){display:none}}
    @media (prefers-reduced-motion:reduce){.ovsk::after,.ovsk-bar::after{animation:none}}
    /* A route's own markup is fetched on first visit; until it lands the page shows its outline. */
    .ov-route-skel{display:grid;gap:14px;padding:24px 16px;max-width:1200px;margin:0 auto}
    .ov-route-skel span{display:block;border-radius:14px;background:color-mix(in srgb,var(--text-muted,#8b93ad) 10%,transparent);animation:ovRouteSkel 1.4s ease-in-out infinite alternate}
    .ov-route-skel span:nth-child(1){height:44px;width:min(420px,70%)}
    .ov-route-skel span:nth-child(2){height:clamp(180px,38vw,420px)}
    .ov-route-skel span:nth-child(3){height:120px;animation-delay:.2s}
    @keyframes ovRouteSkel{from{opacity:.55}to{opacity:1}}
    .ov-route-error{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:24px auto;max-width:640px;padding:16px 18px;border-radius:14px;border:1px solid color-mix(in srgb,var(--danger,#ef4444) 40%,transparent);background:color-mix(in srgb,var(--danger,#ef4444) 10%,var(--bg-card,#171826))}
    .ov-route-error>i{font-size:1.4rem;color:var(--danger-text, var(--danger,#ef4444))}
    .ov-route-error>div{flex:1;min-width:180px;display:grid;gap:2px}
    .ov-route-error span{color:var(--text-muted,#8b93ad);font-size:.9rem}
    @media (prefers-reduced-motion:reduce){.ov-route-skel span{animation:none}}
    /* Widgets their scripts build before cosmetics.css / messenger.css land (both load without blocking): closed, they
       stay out of the page instead of painting unstyled under the footer, and the toggle sits where it will. */
    .cosmetics-modal-overlay:not(.active),.messenger-panel:not(.open){display:none}
    .messenger-toggle{position:fixed;bottom:20px;left:20px;width:52px;height:52px;border:0;border-radius:50%;background:var(--accent-strong,#3472d8);color:var(--on-accent-strong,#fff)}
    </style>

    <!-- Stylesheets.
         Blocking set = what the home page paints with. Everything else belongs to another route
         (the broadcast desk, the messenger, the cosmetics modal, after-show reports, the guide
         overlay) and is fetched without blocking the first paint: media="print" makes the browser
         treat it as non-critical, and the onload flips it back to all once it has arrived. -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- The requested route's own stylesheets (public/features.json), added by the server. -->
    <!--ov:route-css-->

<script>
// Initialize OpenVibe notifications and theme sync (navbar is handled natively by openvibelive).
// Runs on DOMContentLoaded so the now-deferred shared libs (OpenVibeThemeLoader / OpenVibeNotifications)
// have executed first.
document.addEventListener('DOMContentLoaded', function initOpenVibeNetwork() {
    const token = localStorage.getItem('token') || (document.cookie.match(/(?:^|; )ov_token=([^;]*)/) || [])[1] || null;

    if (window.OpenVibeThemeLoader && typeof OpenVibeThemeLoader.init === 'function') {
        // Themes are owned centrally by openvibe.network and synced everywhere — pull the
        // user's active theme from there (configured at openvibe.network/themes).
        OpenVibeThemeLoader.init({ apiBase: 'https://openvibe.network' });
    }

    // Notifications bell
    const mount = document.getElementById('openvibe-bell-mount');
    if (mount && window.OpenVibeNotifications && token) {
        const openvibeToolsBase = (window.OpenVibeNetworkUrls && window.OpenVibeNetworkUrls.tools)
            || (['localhost', '127.0.0.1'].includes(window.location.hostname)
                ? 'http://localhost:3100'
                : (['topenvibe.tools', 'topenvibe.live', 'topenvibe.quest'].includes(window.location.hostname)
                    ? 'https://topenvibe.tools'
                    : 'https://openvibe.network'));
        OpenVibeNotifications.init({
            token: token,
            apiBase: openvibeToolsBase,
            soundBase: '/assets/sounds',
            swPath: '/openvibe-sw.js',
            realtime: true,   // new notifications over OpenVibe.Events, polling as the fallback (Shared 1.22.0)
        });
        OpenVibeNotifications.__ovNavInit = true;   // the shared navbar mounts (and re-mounts) the bell itself
        if (!mount.childElementCount) mount.appendChild(OpenVibeNotifications.createBell());
    }
});
</script>
