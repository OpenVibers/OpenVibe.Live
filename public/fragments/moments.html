<div class="cf-wrap cf-wrap--ai" data-feed="moments">
    <header class="cf-head">
        <div class="cf-head-text">
            <h1 class="cf-h1"><span class="cf-ai-mark" aria-hidden="true"><i class="fa-solid fa-wand-magic-sparkles"></i></span> AI Moments</h1>
            <p class="cf-sub">Auto-clips, standout moments and after-show recaps the AI made from OpenVibe streams. Everything here is AI-generated.</p>
        </div>
        <div class="cf-head-actions">
            <a class="cf-crosslink" href="/content" data-cf-link><i class="fa-solid fa-user-pen" aria-hidden="true"></i> Made by people</a>
        </div>
    </header>
    <div class="cf-bar">
        <div class="cf-chips" role="group" aria-label="Show">
            <button type="button" class="cf-chip" data-cf-type="all" aria-pressed="true">All</button>
            <button type="button" class="cf-chip" data-cf-type="clips" aria-pressed="false"><i class="fa-solid fa-scissors" aria-hidden="true"></i> Auto-clips</button>
            <button type="button" class="cf-chip" data-cf-type="shots" aria-pressed="false"><i class="fa-solid fa-image" aria-hidden="true"></i> Moments</button>
            <button type="button" class="cf-chip" data-cf-type="recaps" aria-pressed="false"><i class="fa-solid fa-clipboard-list" aria-hidden="true"></i> Recaps</button>
        </div>
        <div class="cf-sorts">
            <div class="cf-seg" role="group" aria-label="Sort">
                <button type="button" data-cf-sort="new" aria-pressed="true">New</button>
                <button type="button" data-cf-sort="top" aria-pressed="false">Top</button>
            </div>
            <div class="cf-seg cf-window" role="group" aria-label="Top of" hidden>
                <button type="button" data-cf-window="week" aria-pressed="false">Week</button>
                <button type="button" data-cf-window="month" aria-pressed="true">Month</button>
                <button type="button" data-cf-window="all" aria-pressed="false">All time</button>
            </div>
        </div>
    </div>
    <div class="cf-feed" aria-busy="true"></div>
    <div class="cf-foot" aria-live="polite"></div>
    <div class="cf-sentinel" aria-hidden="true"></div>
</div>
