<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — OpenVibe.Live</title>
    <!-- Keep these in step with index.html — the popout renders the same chat
         components (cosmetics.css positions particle effects; without it they sit
         inline next to the username as "broken badges" until their cleanup timer). -->
    <link rel="stylesheet" href="/css/style.css?v=135">
    <link rel="stylesheet" href="/css/chat-shared.css?v=1">
    <link rel="stylesheet" href="/css/cosmetics.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { display: flex; flex-direction: column; background: var(--bg-primary, #0d0d1a); }

        /* ── Header ── */
        .pc-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 10px; background: var(--bg-secondary, #1a1a2e);
            border-bottom: 1px solid var(--border, #2a2a3e);
            font-size: 0.82rem; font-weight: 600; flex-shrink: 0;
        }
        .pc-header-left { display: flex; align-items: center; gap: 6px; }
        .pc-header-btns { display: flex; gap: 4px; }
        .pc-hbtn {
            background: none; border: none; color: var(--text-secondary, #aaa);
            cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 0.8rem;
            line-height: 1;
        }
        .pc-hbtn:hover, .pc-hbtn.active { background: var(--bg-tertiary, #252540); color: var(--text-primary, #e0e0e0); }
        .pc-hbtn.active { color: var(--accent, #8b5cf6); }

        /* ── Main layout ── */
        .pc-body {
            flex: 1; display: flex; overflow: hidden;
        }
        .pc-chat-col {
            flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0;
        }

        /* ── Side panels ── */
        .pc-panel {
            width: 200px; flex-shrink: 0; border-left: 1px solid var(--border, #2a2a3e);
            background: var(--bg-secondary, #1a1a2e); display: none; flex-direction: column;
            font-size: 0.78rem;
        }
        .pc-panel.visible { display: flex; }
        .pc-panel-hd {
            padding: 8px 10px 6px; font-size: 0.75rem; font-weight: 700;
            color: var(--text-muted, #888); text-transform: uppercase; letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border, #2a2a3e);
        }
        .pc-panel-body { flex: 1; overflow-y: auto; padding: 6px 8px; }

        /* Users panel */
        .pc-user-item {
            display: flex; align-items: center; gap: 6px; padding: 3px 0;
            color: var(--text-secondary, #ccc);
        }
        .pc-user-avatar {
            width: 20px; height: 20px; border-radius: 50%; object-fit: cover;
            background: var(--bg-tertiary, #252540); font-size: 0.7rem; display: flex;
            align-items: center; justify-content: center; flex-shrink: 0;
            color: var(--text-muted, #888);
        }
        .pc-user-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pc-user-role { font-size: 0.65rem; color: var(--accent, #8b5cf6); flex-shrink: 0; }
        .pc-user-anon { color: var(--text-muted, #888); font-style: italic; padding: 3px 0; }

        /* Settings panel */
        .pc-setting-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 5px 0; border-bottom: 1px solid var(--border, #2a2a3e);
        }
        .pc-setting-row:last-child { border-bottom: none; }
        .pc-setting-label { color: var(--text-secondary, #ccc); font-size: 0.78rem; }
        .pc-toggle-wrap { display: flex; align-items: center; }
        .pc-toggle { width: 30px; height: 17px; background: var(--border, #444); border-radius: 9px; position: relative; cursor: pointer; transition: background 0.2s; }
        .pc-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
        .pc-toggle.on { background: var(--accent, #8b5cf6); }
        .pc-toggle.on::after { transform: translateX(13px); }

        /* ── Messages ── */
        .pc-messages {
            flex: 1; overflow-y: auto; padding: 6px 8px;
            font-size: 0.83rem; line-height: 1.4;
        }
        .pc-msg { padding: 2px 0; word-break: break-word; }
        .pc-msg.system { color: var(--text-muted, #888); font-style: italic; font-size: 0.75rem; }
        .pc-msg.deleted { opacity: 0.4; text-decoration: line-through; font-size: 0.75rem; }
        .pc-msg.error { color: var(--danger, #e05555); font-size: 0.75rem; }
        .pc-user-name-tag { font-weight: 600; cursor: default; }
        .pc-time { font-size: 0.68rem; color: var(--text-muted, #888); margin-right: 3px; }
        .pc-stream-badge {
            font-size: 0.62rem; background: rgba(139,92,246,0.2); color: var(--accent, #8b5cf6);
            padding: 1px 4px; border-radius: 3px; margin-right: 4px;
        }
        .pc-badge-admin { font-size: 0.6rem; color: var(--accent, #8b5cf6); margin-right: 2px; }
        .pc-badge-mod { font-size: 0.6rem; color: var(--success, #55e090); margin-right: 2px; }
        .pc-emote { height: 1.2em; vertical-align: middle; }

        /* ── Input ── */
        /* The input itself uses the SHARED chat-input classes from style.css
           (chat-input-row / chat-textarea / chat-send-btn / chat-tools-row), so it
           looks and behaves exactly like the streamer-page chat. Only the wrapper
           is styled here. */
        .pc-input-area {
            padding: 7px 8px;
            border-top: 1px solid var(--border, #2a2a3e);
            background: var(--bg-secondary, #1a1a2e); flex-shrink: 0;
            position: relative; /* anchor for the emote / GIF pickers */
        }

        /* The popout is already popped out — never offer to pop out again. */
        [onclick*="popout"], [onclick*="Popout"], [onclick*="popOut"] { display: none !important; }

        /* Connection badge */
        .pc-conn-dot {
            width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted, #888); flex-shrink: 0;
        }
        .pc-conn-dot.connected { background: var(--success, #55e090); }
        .pc-conn-dot.error { background: var(--danger, #e05555); }
    </style>
</head>
<body>
    <div class="pc-header">
        <div class="pc-header-left">
            <div class="pc-conn-dot" id="pc-conn-dot"></div>
            <i class="fa-solid fa-comments"></i>
            <span id="pc-title">Chat</span>
        </div>
        <div class="pc-header-btns">
            <button class="pc-hbtn" id="pc-btn-users" title="Viewer list" onclick="togglePanel('users')">
                <i class="fa-solid fa-users"></i>
            </button>
            <!-- Opens the SHARED chat settings panel (same one as the streamer page) -->
            <button class="pc-hbtn" id="pc-btn-settings" title="Chat Settings" onclick="toggleChatSettings(this)">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </div>

    <div class="pc-body">
        <div class="pc-chat-col">
            <div class="pc-messages" id="pc-msgs"></div>
            <div class="pc-input-area chat-input-area">
                <!-- Emote / GIF Picker (unprefixed ids → wired to pc-input via getPickerEls) -->
                <div id="emote-picker" class="emote-picker" style="display:none">
                    <div class="emote-picker-header">
                        <input type="text" id="emote-search" class="emote-search" placeholder="Search emotes..." oninput="onEmoteSearch(this.value)">
                    </div>
                    <div class="emote-picker-tabs"></div>
                    <div class="emote-picker-grid" id="emote-picker-grid"></div>
                </div>
                <!-- Shared chat input — the SAME markup/classes as the streamer page,
                     so chat.js's delegated behaviors (auto-resize, Enter-to-send,
                     autocomplete) and future input upgrades apply here automatically. -->
                <div class="chat-input-row">
                    <textarea id="pc-input" class="chat-textarea" placeholder="Send a message..." maxlength="500"
                              rows="1" autocomplete="off" spellcheck="true" enterkeyhint="send"></textarea>
                    <button class="chat-send-btn" onclick="sendChat()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <div class="chat-tools-row">
                    <button class="emote-picker-btn" onclick="toggleEmotePicker('pc-input')" title="Emotes">
                        <i class="fa-solid fa-face-smile"></i>
                    </button>
                    <button class="emote-picker-btn gif-btn" onclick="toggleGifPicker('pc-input')" title="GIFs">
                        <span class="gif-btn-text">GIF</span>
                    </button>
                    <button class="emote-picker-btn" onclick="if(typeof openChannelUploadModal==='function')openChannelUploadModal()" title="Add channel emote / sound">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <button class="chat-tts-toggle tts-active" id="pc-tts-btn" onclick="toggleChatTTS(this)" title="TTS On (click to mute)">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <button class="btn btn-openvibe-coins-mini chat-nickels-float" onclick="if(typeof toggleRewardsPanel==='function')toggleRewardsPanel()" title="Channel points (click for rewards)">
                        <i class="fa-solid fa-coins"></i> <span class="rewards-coin-balance">0</span>
                    </button>
                    <button class="btn btn-openvibe-bucks-mini" onclick="if(typeof showModal==='function')showModal('donate')" title="Send Vibes">
                        <i class="fa-solid fa-dollar-sign"></i>
                    </button>
                    <button class="btn btn-openvibe-bucks-mini" onclick="if(typeof openSubscribeForCurrentStream==='function')openSubscribeForCurrentStream()" title="Subscribe to this channel">
                        <i class="fa-solid fa-star"></i>
                    </button>
                </div>
                <!-- Rewards Panel (OpenCoins) -->
                <div class="rewards-panel" id="ch-rewards-panel" style="display:none">
                    <div class="rewards-panel-header">
                        <span><i class="fa-solid fa-coins"></i> OpenCoins Rewards</span>
                        <span class="rewards-coin-bal"><i class="fa-solid fa-coins"></i> <span class="rewards-coin-balance">0</span></span>
                    </div>
                    <div class="rewards-grid ch-rewards-grid">
                        <p class="muted">No rewards configured for this channel</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Users panel -->
        <div class="pc-panel" id="pc-panel-users">
            <div class="pc-panel-hd">
                <i class="fa-solid fa-users"></i> Viewers
            </div>
            <div class="pc-panel-body" id="pc-users-body">
                <div class="pc-user-anon muted">Loading…</div>
            </div>
        </div>

        <!-- Settings render via the SHARED chat settings panel (toggleChatSettings)
             inside the chat column — full parity with the streamer page. -->
    </div>

    <!-- Shared modal + toast containers — showModal('donate'), the [+] channel-upload
         modal, buy-Vibes, etc. all render into these exactly like on the main site. -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>
    <div class="toast-container" id="toast-container"></div>

    <!-- Chat feature scripts — mirror index.html so the popout has full parity.
         Order: dependencies (app/emotes/gif/uploads/coins/bucks/cosmetics) before chat.js. -->
    <script src="/js/app.js?v=126"></script>
    <script src="/js/emotes.js?v=8"></script>
    <script src="/js/gif-picker.js?v=1"></script>
    <script src="/js/channel-uploads.js?v=12"></script>
    <script src="/js/vibes.js?v=10"></script>
    <script src="/js/opencoins.js?v=6"></script>
    <script src="/js/cosmetics-ui.js?v=2"></script>
    <script src="/js/chat.js?v=76"></script>
    <script src="/js/chat-autocomplete.js?v=1"></script>
    <script>
    'use strict';

    // ── URL parsing ──────────────────────────────────────────────────────────
    // Pretty form:  /chat/global · /chat/<username> · /chat/<username>/<streamId>
    // Legacy form:  /popout-chat.html?popout=1&mode=stream&stream=<id> (self-upgrades)
    const params = new URLSearchParams(window.location.search);
    let mode = 'global';          // 'global' | 'channel' (username-scoped, live-following)
    let channelName = null;       // streamer username
    let channelUserId = null;     // resolved streamer user id
    let pinnedStreamId = null;    // requested stream id (only honored while it's live)
    let activeStreamId = null;    // stream id the chat is currently joined to (null = channel chat)

    (function parseUrl() {
        const seg = window.location.pathname.split('/').filter(Boolean); // ['popout'|'popout-chat', user?, id?]
        if (seg[0] === 'popout' || seg[0] === 'popout-chat') {
            // No username (or explicit "global") → global chat.
            if (!seg[1] || seg[1].toLowerCase() === 'global') { mode = 'global'; return; }
            mode = 'channel';
            channelName = decodeURIComponent(seg[1]);
            pinnedStreamId = seg[2] ? parseInt(seg[2], 10) || null : null;
            return;
        }
        // Legacy query params
        const qMode = params.get('mode') || 'global';
        if (qMode === 'stream' && params.get('stream')) {
            mode = 'channel';
            pinnedStreamId = parseInt(params.get('stream'), 10) || null; // username resolved at boot
        }
    })();

    function prettyPath() {
        if (mode !== 'channel' || !channelName) return '/popout/global';
        return '/popout/' + encodeURIComponent(channelName) + (activeStreamId ? '/' + activeStreamId : '');
    }
    // Keep the address bar honest without polluting history — swaps replace, they
    // don't stack, so Back still leaves the popout instead of replaying old streams.
    function syncUrl() {
        try { history.replaceState({ mode, channelName, streamId: activeStreamId }, '', prettyPath()); } catch { /* */ }
    }
    function syncTitle(liveLabel) {
        const label = mode === 'channel'
            ? ((channelName || 'Chat') + (activeStreamId ? (liveLabel ? ' — ' + liveLabel : ' — live') : ' — channel chat'))
            : 'Global Chat';
        document.title = label + ' — OpenVibe.Live';
        document.getElementById('pc-title').textContent = label;
    }
    syncTitle();

    // ── Settings: entirely the shared chat.js settings panel (toggleChatSettings) ──
    // chat.js already called loadChatSettings() on boot, and the panel renders with
    // buildSettingsPanelHTML — every setting the streamer page has, kept in sync
    // across tabs by the shared storage listener.

    // Request the viewer list over the shared chat WebSocket. The reply is
    // handled by chat.js → renderChatUsersList(), which now also fills #pc-users-body.
    window.requestUserList = function() {
        try {
            if (typeof chatWs !== 'undefined' && chatWs && chatWs.readyState === WebSocket.OPEN) {
                chatWs.send(JSON.stringify({ type: 'get-users' }));
            }
        } catch {}
    };

    window.togglePanel = function(name) {
        const panelEl = document.getElementById('pc-panel-' + name);
        const btnEl = document.getElementById('pc-btn-' + name);
        if (!panelEl) return;
        const opening = !panelEl.classList.contains('visible');
        document.querySelectorAll('.pc-panel').forEach(p => p.classList.remove('visible'));
        document.querySelectorAll('.pc-hbtn').forEach(b => b.classList.remove('active'));
        if (opening) {
            panelEl.classList.add('visible');
            if (btnEl) btnEl.classList.add('active');
            if (name === 'users' && typeof requestUserList === 'function') requestUserList();
        }
    };

    // Re-show the on-page chat immediately when this popout is closed
    // (the opener's setInterval poll is the fallback for this).
    window.addEventListener('beforeunload', function() {
        if (!window.opener) return;
        try {
            window.opener.document.querySelectorAll('.chat-popped-out')
                .forEach(function(el) { el.classList.remove('chat-popped-out'); });
        } catch {}
    });

    function initPopoutChat() {
        // Keep the input-area TTS button state in sync with the shared settings.
        try { if (typeof syncTTSToggleButtons === 'function') syncTTSToggleButtons(); } catch { /* */ }

        joinTarget();
        // Enter-to-send, Shift+Enter newline, and auto-resize all come from chat.js's
        // delegated .chat-textarea handlers — no popout-specific wiring needed.
        const input = document.getElementById('pc-input');
        if (input) input.focus();
    }

    function inheritTheme() {
        if (!window.opener) return;
        try {
            const openerStyle = window.opener.document.documentElement.style;
            const cssVars = ['--bg-primary', '--bg-secondary', '--bg-tertiary', '--border',
                '--text-primary', '--text-secondary', '--text-muted', '--accent',
                '--danger', '--success'];
            cssVars.forEach((v) => {
                const val = openerStyle.getPropertyValue(v);
                if (val) document.documentElement.style.setProperty(v, val);
            });
        } catch {}
    }

    // Publish the channel context into the shared globals app.js/channel-uploads.js/
    // vibes.js read — the [+] upload modal and the donate modal resolve their channel
    // from these, exactly like on a channel page.
    function syncContext() {
        try { if (typeof _activeChannelUserId !== 'undefined') _activeChannelUserId = channelUserId || null; } catch { /* */ }
        try { if (typeof currentStreamId !== 'undefined') currentStreamId = activeStreamId || null; } catch { /* */ }
        try { if (typeof currentChannelUsername !== 'undefined') currentChannelUsername = channelName || null; } catch { /* */ }
    }

    // ── Channel-follow: join the right room and keep following the live state ──
    function joinTarget() {
        syncContext();
        if (typeof initChat !== 'function') return;
        if (mode === 'channel') initChat(activeStreamId, channelUserId);
        else initChat(null);
    }

    // A locally-rendered notice (never sent to the server). initChat's history
    // hydrate clears the container shortly after a swap, so post it after settle.
    function localNotice(text) {
        setTimeout(() => { try { if (typeof addSystemMessage === 'function') addSystemMessage(text); } catch { /* */ } }, 1600);
    }

    async function fetchLiveState() {
        const r = await fetch(`/api/streams/channel/${encodeURIComponent(channelName)}/live`);
        if (!r.ok) throw new Error('channel lookup failed');
        const data = await r.json();
        if (data.channel) {
            channelUserId = data.channel.user_id || channelUserId;
            channelName = data.channel.username || channelName;
        }
        return data.streams || [];
    }

    // Decide which stream the popout SHOULD be in right now:
    // pinned stream while it's live → the stream we're already in while it's live
    // (concurrent slots can reorder by viewer count — never flap between them) →
    // any other live stream → channel chat (null).
    function desiredTarget(liveStreams) {
        const liveIds = liveStreams.map(s => Number(s.id));
        if (pinnedStreamId && liveIds.includes(Number(pinnedStreamId))) return Number(pinnedStreamId);
        if (activeStreamId != null && liveIds.includes(Number(activeStreamId))) return activeStreamId;
        return liveIds.length ? liveIds[0] : null;
    }

    let _watchTimer = null;
    async function watchLiveState() {
        if (mode !== 'channel') return;
        try {
            const live = await fetchLiveState();
            const want = desiredTarget(live);
            if (want !== activeStreamId) {
                const wasStream = activeStreamId != null;
                activeStreamId = want;
                if (want == null) pinnedStreamId = null; // the pin died with its stream
                joinTarget();
                syncUrl();
                syncTitle(live.find(s => Number(s.id) === want)?.title);
                if (want == null) {
                    localNotice(`🔀 The stream ended — you're now in ${channelName}'s channel chat. You'll hop back in automatically when they go live.`);
                } else if (wasStream) {
                    localNotice(`🔀 That stream ended — switched you to ${channelName}'s current live stream.`);
                } else {
                    localNotice(`🔴 ${channelName} just went live — switched you to the live stream chat.`);
                }
            }
        } catch { /* transient — retry next tick */ }
        _watchTimer = setTimeout(watchLiveState, 20000);
    }

    async function resolveAndBoot() {
        if (mode === 'channel') {
            try {
                // Legacy ?stream=<id> URLs carry no username — resolve it from the stream.
                if (!channelName && pinnedStreamId) {
                    const r = await fetch(`/api/streams/${pinnedStreamId}`);
                    if (r.ok) {
                        const s = await r.json();
                        channelName = s.username || (s.stream && s.stream.username) || null;
                        channelUserId = s.user_id || (s.stream && s.stream.user_id) || null;
                    }
                }
                if (!channelName) { mode = 'global'; syncTitle(); }
                else {
                    const live = await fetchLiveState();
                    activeStreamId = desiredTarget(live);
                    if (activeStreamId == null) pinnedStreamId = null;
                    syncUrl();   // upgrades legacy URLs to /chat/<user>[/<id>] too
                    syncTitle(live.find(s => Number(s.id) === activeStreamId)?.title);
                }
            } catch { /* boot with whatever we parsed */ }
        }
        initPopoutChat();
        if (mode === 'channel') _watchTimer = setTimeout(watchLiveState, 20000);
    }

    function startPopoutChat() {
        inheritTheme();
        resolveAndBoot();
    }

    startPopoutChat();
    </script>
</body>
</html>
