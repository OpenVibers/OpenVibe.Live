## ═══════════════════════════════════════════════════════════════
## openvibe.live — Nginx Configuration (REFERENCE)
##
## This file is what is actually deployed to /etc/nginx/sites-available/openvibe.live.conf
## — keep them in sync, and reload nginx after changing it.
##
## There is also a generator (OpenVibe.Network server/deploy/nginx-generator.js, driven
## from the admin panel's Deploy → Nginx). As of 2026-09-17 its `live` entry carries the WHIP and
## ingest hostnames, both connection budgets, the static proxy cache and gzip, and
## OpenVibe.Network test/nginx-generator-live.test.js fails if any of them go missing. Remaining
## differences: the generator adds X-Frame-Options/X-Content-Type-Options/Referrer-Policy headers
## and a *.openvibe.live server name, and writes per-site access logs. Change both together.
## ═══════════════════════════════════════════════════════════════

# Access logs without query strings: WebSocket URLs carry the session token (?token=…), and a
# log line is a much wider audience than the connection it came from.
log_format ov_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# Two separate per-IP connection budgets. They must not share one counter: the app
# holds a lot of long-lived WebSockets open (chat, control, SFU viewer, PiP camera,
# notifications, messenger — 5-6 per open tab), and those sockets would otherwise eat
# the budget that a page load needs for its stylesheets and scripts.
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
limit_conn_zone $binary_remote_addr zone=asset_limit:10m;

# Static responses cached in front of Node. Node still decides the cache policy — a ?v= that matches
# the file's content hash is immutable, anything else is no-cache (see server/web/assets.js) — and
# nginx only stores what Node marks cacheable, so correctness stays with the hash check while repeat
# fetches (Cloudflare revalidation misses, new edge PoPs) stop reaching the event loop that also
# carries chat, WHIP signaling and RTMP callbacks. Measured locally: style.css took a 67ms median
# from Node under 8 concurrent requests.
proxy_cache_path /var/cache/nginx/openvibe-live levels=1:2 keys_zone=live_static:20m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.live www.openvibe.live whip.openvibe.live ingest.openvibe.live;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openvibe.live www.openvibe.live whip.openvibe.live ingest.openvibe.live;

    ssl_certificate     /etc/letsencrypt/live/openvibe.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 3m;
    access_log /var/log/nginx/access.log ov_noquery;

    # Compress text for the hop to Cloudflare as well (the global config only compresses text/html and
    # never proxied responses). Media formats are already compressed and are left alone.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml text/xml;

    # 30 was far too low. A single viewer with a few tabs open holds ~30 WebSockets on
    # its own, and once an address hit the ceiling every NEW request from it was answered
    # with a bare 503 — including stylesheets, which is why the site would occasionally
    # render as raw unstyled HTML until a refresh happened to find room. Shared addresses
    # (a household, a campus, a mobile carrier) reach it far sooner. Abuse is already
    # handled by limit_req on /api/; this stays only as a slowloris backstop, at a
    # ceiling ordinary traffic cannot reach.
    limit_conn addr_limit 256;

    location = /api/auth/register {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /data/avatars/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ^~ /api/thumbnails/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Upload-heavy endpoints: VOD chunks, clip creation, VOD upload
    location ~ ^/api/vods/(upload|clips|stream/) {
        client_max_body_size 500m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OpenVibe.Chat (Wave 6) serves /ws/chat, /api/chat/, /api/dm/, /api/tts/ and /api/sounds
    # (its repo's deploy/nginx). A glob include is a no-op when Chat is not installed.
    include /opt/openvibe.chat/deploy/nginx/*.locations.conf;

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files get their own budget, so a page can always finish loading its CSS and
    # JS no matter how many sockets the same address is already holding open. Matched by
    # extension rather than by directory because render-blocking scripts are served from
    # the web root too (/live-notify.js), not only from /js/. The lookahead keeps /api/
    # and /ws/ out: a regex location would otherwise win over their prefix locations and
    # quietly strip their rate limiting and WebSocket upgrade headers.
    location ~ ^/(?!api/|ws/|data/|media/).*\.(?:css|js|mjs|map|woff2?|ttf|otf|svg|png|jpe?g|gif|ico|webp|mp3|wav)$ {
        limit_conn asset_limit 100;
        proxy_cache live_static;
        proxy_cache_key "$host$uri$is_args$args";
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502 http_503;
        # Only responses Node marked public+max-age are stored; no-cache/no-store pass straight through.
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Allow camera, microphone, and screen capture for WebRTC broadcasting
        add_header Permissions-Policy "camera=*, microphone=*, display-capture=*" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
